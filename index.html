========================================== -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
  />

  <title>TakeOutMaster Roguelike</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- PWA設定 -->
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#d60000">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="TOマスター"
  >

  <link
    rel="apple-touch-icon"
    href="./images/icons/icon-192.png"
  >
</head>
<body>

  <div id="startScreen">
    <div id="startBox">
      <img id="titleImage" src="images/ui/title_logo.png" alt="TakeOutMaster" />
      <p>レベルを選んでください</p>
      <button class="levelButton" data-level="1">レベル1</button>
      <button class="levelButton" data-level="2">レベル2</button>
      <button class="levelButton" data-level="3">レベル3</button>
    </div>
  </div>

  <header id="ui">
    <div>LEVEL <span id="levelNumber">1</span></div>
    <div>FLOOR <span id="floorNumber">1</span> / 10</div>

    <div id="hpBar">
      <img src="images/ui/heart_full.png" alt="HP" />
      <img src="images/ui/heart_full.png" alt="HP" />
      <img src="images/ui/heart_full.png" alt="HP" />
    </div>

    <div id="message"></div>
  </header>

  <div id="root">
    <canvas id="gameCanvas"></canvas>

    <aside id="sidePanel">

  <div id="topSideRow">

    <section id="ticketPanel">
      <div id="ticketTitle">伝票</div>
      <div id="ticketText"></div>
    </section>

    <section id="productPanel">
      <img id="productImage" src="" alt="product" />
      <h2 id="productName"></h2>
    </section>

  </div>
<section id="bagPanel">
  <div id="bagTitle">袋</div>

  <div id="bagVisual">
    <img id="bagImage" src="images/bag/bag1.png" alt="袋">
    <div id="pickedList"></div>
  </div>
</section></aside>
  </div>

  <script src="./item.js"></script>
<script src="./map.js"></script>
<script src="./player.js"></script>
<script src="./game.js"></script>

<!-- Service Worker登録 -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then(registration => {
          console.log(
            "Service Worker登録成功:",
            registration.scope
          );
        })
        .catch(error => {
          console.error(
            "Service Worker登録失敗:",
            error
          );
        });
    });
  }
</script>

</body>
</html>
