function startGame(){

shuffle(questionPool);

questionPool = questionPool.slice(0,10);
    currentIndex = 0;

    loadQuestion();
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]]
        =
        [array[j],array[i]];
    }

}

function showStage1(){


document.getElementById(
    "stageTitle"
).innerText =
"ステージ1：仕上げ";

document.getElementById(
    "effectArea"
).innerHTML = "";

let choices = [
    "パセリ",
    "ゴマ",
    "ナッツ",
    "粉チーズ",
    "福神漬け"
];

if(currentQuestion.stage1 !== "なし"){

    if(Array.isArray(currentQuestion.stage1)){

        // まぐろたたき丼だけ専用
        if(currentQuestion.name === "まぐろたたき丼"){

            const wrongChoices = [
                "パセリ",
                "ゴマ",
                "ナッツ",
                "粉チーズ",
                "福神漬け"
            ];

            const randomWrong =
            wrongChoices[
                Math.floor(
                    Math.random() * wrongChoices.length
                )
            ];

            choices = [
                "わさび",
                "だし醤油",
                randomWrong
            ];

        }else{

            // チーズ牛カルビ丼など
            choices = [...currentQuestion.stage1];

        }

    }else{

        choices = [currentQuestion.stage1];

    }

    const allStage1 = [
        "パセリ",
        "ゴマ",
        "ナッツ",
        "粉チーズ",
        "福神漬け"
    ];

    while(choices.length < 3){

        const randomItem =
        allStage1[
            Math.floor(
                Math.random() * allStage1.length
            )
        ];

        if(!choices.includes(randomItem)){
            choices.push(randomItem);
        }

        "セット商品または小袋・付属品が違います。",
        false
    );
}

/* ==========================
3択生成
========================== */

function createChoices(){


let answers =
[...currentQuestion.stage2];

const allItems = [

    "生玉子",
    "タバスコ",
    "山椒",
    "わさび",
    "だし醤油",
    "きざみのり",
    "辛口ソース",
    "カルビだれ",
    "かつお節",
    "とろろ",
    "おろし",
    "ドレッシング",
    "シーザードレッシング"

];

/* ここ追加 */

let wrongItems = [...allItems];

if(currentQuestion.name === "まぐろたたき丼"){

    wrongItems = wrongItems.filter(
        item =>
        item !== "わさび" &&
        item !== "だし醤油"
    );
}

/* ここまで追加 */

let choices = [...answers];

while(choices.length < 3){

    let randomItem =
    wrongItems[
    Math.floor(
    Math.random()
    * wrongItems.length
    )];
choices.push(randomItem);
   }

shuffle(choices);

let html="";

choices.forEach(item=>{

    html += `
    <div class="choice"
         onclick="addItem('${item}')">

        <img src="${itemImages[item]}">

        <br>

        ${item}

    </div>
    `;

});

document.getElementById(
    "choices"
).innerHTML = html;


}

/* ==========================
袋へ追加
========================== */

function addItem(item){

    const target =
    event.currentTarget;

    if(
        target.classList.contains(
            "selected"
        )
    ){

        const index =
        selectedStage2.indexOf(item);

        if(index !== -1){
            selectedStage2.splice(index,1);
        }

        target.classList.remove(
            "selected"
        );

    }else{

        selectedStage2.push(item);

        target.classList.add(
            "selected"
        );
    }

    buildBag();
}

/* ==========================
袋表示
========================== */

function buildBag(){


let html = `
<h3>📦 袋</h3>

`;

selectedStage2.forEach(
(item,index)=>{

    let displayName = item;

    if(item === "チョレギドレッシング"){

        displayName =
        "<span style='font-size:11px;line-height:1.0;'>チョレギ<br>ドレッシング</span>";

    }

    html += `
    <div class="bagItem"
         onclick="removeItem(${index})">

        <img src="${itemImages[item]}">
        <br>

        ${displayName}

    </div>
    `;

});
document.getElementById(
    "bag"
).innerHTML = html;

let noticeHtml = `
<div style="
font-size:24px;
font-weight:bold;
color:red;
text-align:center;
margin-top:10px;
">
⚠️ 入れ忘れ注意 ⚠️
</div>

<div style="
display:flex;
justify-content:center;
gap:25px;
margin-top:8px;
">
<div>
<img src="images/toset.jpg"
     style="
     width:170px;
     height:80px;
     object-fit:contain;
">
<br>
TOセット
</div>
`;

if(
    currentQuestion.name.includes("カレー")
){

    noticeHtml += `
    <div>
   <img src="images/spoon.jpg"
     style="
     width:155px;
     height:80px;
     object-fit:contain;
     ">
    <br>
    スプーン
    </div>
    `;
}

noticeHtml += `
</div>
`;

document.getElementById(
    "bagNotice"
).innerHTML = noticeHtml;

}



/* ==========================
袋から削除
========================== */

function removeItem(index){


selectedStage2.splice(
    index,
    1
);

buildBag();


}

/* ==========================
採点
========================== */

function checkAnswer(){

let correct =
[...currentQuestion.stage2];

let selected =
[...selectedStage2];

correct.sort();
selected.sort();

const ok =
JSON.stringify(correct)
===
JSON.stringify(selected);

if(ok){

    document.getElementById("correctSound").play();

    showPopup(
        "⭕ 正解",
        currentQuestion.reason,
        true
    );

}else{

    document.getElementById("wrongSound").play();

    showPopup(
        "❌ 不正解",
        currentQuestion.reason,
        false
    );

}

}

/* ==========================
スタート
========================== */

function showPopup(title,text,isCorrect=true){

    document.getElementById(
        "popupTitle"
    ).innerText = title;

    document.getElementById(
        "popupText"
    ).innerText = text;

    document.getElementById(
        "popup"
    ).style.display = "flex";

    setTimeout(()=>{

        document.getElementById(
            "popup"
        ).style.display = "none";

if(isCorrect){

    if(gameLevel === 1){

        currentIndex++;

        loadQuestion();

    }

} else{

    if(gameLevel === 1){

        selectedStage2=[];

        buildBag();

    }

}
    },2500);

}

function closePopup(){

    document.getElementById(
        "popup"
    ).style.display = "none";

    currentIndex++;

    loadQuestion();
}
let gameLevel = 1;

function startLevel(level){

    gameLevel = level;

    document.getElementById(
        "menuScreen"
    ).style.display = "none";

    document.getElementById(
        "gameScreen"
    ).style.display = "block";

    if(level === 1){

        startGame();

    }else if(level === 2){

        startLevel2();

    }
}
